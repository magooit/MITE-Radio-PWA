<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITE Radio PWA</title>
  <link rel="manifest" href="./manifest.json">
  
  <style>
    h3 {
      text-align: center;
      margin-bottom: 10px;
      background-color: #78a3b5;
      color: white;
      padding: 10px;
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 16px;
      border: 1px solid white;
      cursor: pointer;
    }
    .selected {
      background-color: #4165b9;
    }
    #sc-player { width: 100%; }
    a { color: white; text-decoration: none; }
    .calendar {
      display: none;
      border: 1px solid #777;
      width: 100%;
      height: 600px;
    }
    .header-container { display: flex; justify-content: space-around; }
    .header-container h3 { flex: 1; text-align: center; cursor: pointer; margin: 0; }
    .footer {
      text-align: center;
      background-color: white;
      color: black;
      padding: 10px;
      font-size: 10px;
      margin-top: 20px;
    }

    /* Apply alternating shading to list items */
    [data-widget="mcp-recently-played"] ul li,
    [data-widget="mcp-recently-played"] ul li * {
        font-family: 'Arial', sans-serif !important;
        font-size: 15px !important; /* Adjust 14px to your desired size */
    }

    [data-widget="mcp-recently-played"] ul li:nth-child(odd) {
        background-color: #f0f0f0 !important;
    }

    [data-widget="mcp-recently-played"] ul li:nth-child(even) {
        background-color: #ffffff !important;
    }

  </style>
</head>

<script type="text/javascript" language="javascript" src="https://carina.streamerr.co:2020/dist/widgets.js" defer></script>
<body>
  <div id="live-status" style="padding: 10px; font-weight: bold;">
        <h3>Loading stream status...</h3>
  </div>
  
  <div data-widget="mcp-now-playing-cover" data-name="miteradio" data-coverart="true" data-styled="true" data-cover="true" style="height: 330px"></div>
  
  <div id="Website-player">
    <audio id="native-audio" controls preload="none" style="width: 100%;">
    <source src="https://carina.streamerr.co/stream/miteradio?ua=Website-Player" type="audio/mpeg">
    Your browser does not support the audio element.
    </audio>
  </div>
  
  <h3>Recently Played</h3>
  <div data-widget="mcp-recently-played" data-name="miteradio" data-limit="5" data-covers="true"></div>

  <h3><a href="https://www.miteradio.com.au/blog.html" target="_blank">Check out the MITE Radio Blog</a></h3>
  <h3><a href="https://docs.google.com/forms/d/e/1FAIpQLScgiAMMGkA1gbSBJvZlRMJE42PjkVzftgzzq2-6uhUFaqH3UA/viewform" target="_blank">Do you have a question?</a></h3>

<div class="header-container">
    <h3 id="headingWST" onclick="toggleCalendar(event, 'calendarWST', 'headingWST')">Schedule Perth Time WST</h3>
    <h3 id="headingACST" onclick="toggleCalendar(event, 'calendarACST', 'headingACST')">Australia Central Time ACST</h3>
    <h3 id="headingAEST" onclick="toggleCalendar(event, 'calendarAEST', 'headingAEST')">Australia Eastern Time AEST</h3>
</div>

<iframe id="calendarWST" class="calendar" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Australia%2FPerth&mode=AGENDA&src=a2F5QHN0YWlyd2F5cHJvamVjdC5vcmc&color=%234285F4" frameborder="0" scrolling="no"></iframe>
<iframe id="calendarACST" class="calendar" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Australia%2FAdelaide&mode=AGENDA&src=a2F5QHN0YWlyd2F5cHJvamVjdC5vcmc&color=%234285F4" frameborder="0" scrolling="no"></iframe>
<iframe id="calendarAEST" class="calendar" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Australia%2FSydney&mode=AGENDA&src=a2F5QHN0YWlyd2F5cHJvamVjdC5vcmc&color=%234285F4" frameborder="0" scrolling="no"></iframe>
 
  <script>
    let lastScrollPos = 0;
    function toggleCalendar(event, calendarId, headingId) {
      event.preventDefault();
      var selectedCalendar = document.getElementById(calendarId);
      var selectedHeading = document.getElementById(headingId);

      if (selectedCalendar.style.display === "block") {
        lastScrollPos = window.scrollY;
        selectedCalendar.style.display = "none";
        window.scrollTo({ top: lastScrollPos, behavior: "smooth" });
        selectedHeading.classList.remove('selected');
      } else {
        document.querySelectorAll('.calendar').forEach(c => c.style.display = "none");
        document.querySelectorAll('h3').forEach(h => h.classList.remove('selected'));
        selectedCalendar.style.display = "block";
        selectedHeading.classList.add('selected');
        setTimeout(() => selectedCalendar.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
      }
    }
  </script>

  <script>
    // Media Session API integration
    const nativeAudio = document.getElementById('native-audio');

    if ('mediaSession' in navigator && nativeAudio) {
      
      // Set metadata immediately so the OS knows what this player is
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'MITE Radio Live Stream',
        artist: 'MITE Radio',
        album: 'Live Internet Broadcast'
      });

      nativeAudio.addEventListener('play', () => {
        navigator.mediaSession.playbackState = 'playing';
      });

      nativeAudio.addEventListener('pause', () => {
        navigator.mediaSession.playbackState = 'paused';
      });

      // Action handlers for lock screen controls
      navigator.mediaSession.setActionHandler('play', async () => {
        try {
          await nativeAudio.play();
          navigator.mediaSession.playbackState = 'playing';
        } catch (err) {
          console.error("Playback failed:", err);
        }
      });

      navigator.mediaSession.setActionHandler('pause', () => {
        nativeAudio.pause();
        navigator.mediaSession.playbackState = 'paused';
      });
    }
  </script>
  
  <script>
        function checkLiveStatus() {
            fetch('https://carina.streamerr.co:2020/json/stream/miteradio')
                .then(response => response.json())
                .then(data => {
                    const statusElement = document.getElementById('live-status');
                    
                    // Using startsWith is safer as we discussed
                    if (data.nowplaying && data.nowplaying.startsWith("DJ ")) {
                        statusElement.innerText = "LIVE: " + data.nowplaying;
                        statusElement.style.backgroundColor = "darkred";
                        statusElement.style.color = "white"
                        statusElement.style.fontFamily = "Arial, sans-serif";
                        statusElement.style.fontSize = "16px";
                    } else {
                        statusElement.innerText = "Now Playing"// + data.nowplaying;
                        statusElement.style.backgroundColor = "#78a3b5";
                        statusElement.style.color = "white";
                        statusElement.style.fontFamily = "Arial, sans-serif";
                        statusElement.style.fontSize = "16px";
                        statusElement.style.textAlign = "center";
                    }
                })
                .catch(err => {
                    console.error("Could not fetch status:", err);
                    document.getElementById('live-status').innerText = "Stream status unavailable";
                });
        }

        // Run once immediately when the page loads
        checkLiveStatus();

        // Check again every 30 seconds (30000 milliseconds)
        setInterval(checkLiveStatus, 30000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
  
  <div class="footer">
    v1.02 Usage terms and conditions on the MITE Radio website
  </div>

</body>
</html>
